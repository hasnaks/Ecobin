apiVersion: v1
kind: Secret
metadata:
  name: ecobin-secret
  namespace: ecobin
type: Opaque
stringData:
  JWT_SECRET: change-me-in-production
  # Optional: hosted PostgreSQL (e.g. Neon). Create with:
  #   kubectl -n ecobin create secret generic ecobin-secret --from-literal=DATABASE_URL='postgresql://...'
  # or edit this value before applying. Leave unset to use the PVC-backed SQLite fallback.
  DATABASE_URL: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ecobin-data
  namespace: ecobin
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecobin-backend
  namespace: ecobin
spec:
  replicas: 1 # SQLite lives on a single volume, so keep one replica
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ecobin-backend
  template:
    metadata:
      labels:
        app: ecobin-backend
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: backend
          image: ecobin-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: DB_PATH
              value: /data/ecobin.sqlite
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecobin-secret
                  key: DATABASE_URL
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecobin-secret
                  key: JWT_SECRET
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ecobin-data
---
apiVersion: v1
kind: Service
metadata:
  name: ecobin-backend
  namespace: ecobin
spec:
  selector:
    app: ecobin-backend
  ports:
    - port: 4000
      targetPort: 4000
